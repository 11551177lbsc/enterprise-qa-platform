<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <title>登录</title>

    <style>

        body{
            font-family: Arial;
            background:#f5f5f5;
        }

        .box{
            width:300px;
            margin:150px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            text-align:center;
        }

        input{
            width:90%;
            padding:8px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:#4CAF50;
            color:white;
            border:none;
        }

        a{
            display:block;
            margin-top:10px;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>登录</h2>

    <input id="username" placeholder="用户名">

    <input id="password" type="password" placeholder="密码">

    <button onclick="login()">登录</button>

    <a href="register.html">注册账号</a>

</div>

<script>

    function login(){

        let username=document.getElementById("username").value;
        let password=document.getElementById("password").value;

        fetch("/auth/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                username:username,
                password:password
            })

        })
            .then(res=>res.json())
            .then(res=>{

                console.log("登录返回数据:",res);

                localStorage.setItem("token",res.token);
                localStorage.setItem("userId",res.userId);

                alert("登录成功");

                location.href="chat.html";

            })
            .catch(err=>{
                console.error(err);
                alert("登录失败");
            })

    }
</script>

</body>
</html>
