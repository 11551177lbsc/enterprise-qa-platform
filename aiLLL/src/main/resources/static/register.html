<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <title>注册</title>

    <style>

        body{
            font-family: Arial;
            background:#f5f5f5;
        }

        .box{
            width:300px;
            margin:150px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            text-align:center;
        }

        input{
            width:90%;
            padding:8px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:#2196F3;
            color:white;
            border:none;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>注册</h2>

    <input id="username" placeholder="用户名">

    <input id="password" type="password" placeholder="密码">

    <button onclick="register()">注册</button>

</div>

<script>

    function register(){

        let username=document.getElementById("username").value;
        let password=document.getElementById("password").value;

        fetch("/auth/register",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                username:username,
                password:password
            })

        })
            .then(res=>res.text())
            .then(data=>{

                alert(data);

                location.href="login.html";

            })

    }

</script>

</body>
</html>
